---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-dashboard
  namespace: monitoring

spec:
  rules:
  - host: prometheus.tycng.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-k8s
            port:
              number: 9090
