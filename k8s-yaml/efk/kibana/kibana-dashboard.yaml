apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-k8s
  namespace: elasticsearch

spec:
  rules:
  - host: kibana.tycng.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana-k8s
            port:
              number: 5601
